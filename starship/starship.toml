# Prompt module order — only listed modules appear
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$kubernetes\
$aws\
$terraform\
$docker_context\
$cmd_duration\
$line_break\
$character"""

command_timeout = 1000

# ── Username & Hostname ───────────────────────────────────────
[username]
style_user = "yellow bold"
style_root = "red bold"
format = "[$user]($style) "
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "[$hostname](bold blue) "
disabled = false

# ── Directory ─────────────────────────────────────────────────
[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " 󰌾"

# ── Git ───────────────────────────────────────────────────────
[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold purple"
symbol = " "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"

# ── Kubernetes ────────────────────────────────────────────────
[kubernetes]
disabled = false
symbol = "⎈"
format = '[$symbol](bright-black) [$context( \($namespace\))]($style) '

[[kubernetes.contexts]]
context_pattern = ".*prod.*"
style = "bold red"
symbol = "⎈"

[[kubernetes.contexts]]
context_pattern = ".*staging.*"
style = "bold yellow"
symbol = "⎈"

# ── AWS ───────────────────────────────────────────────────────
[aws]
format = '[$symbol($profile )(\($region\))]($style) '
style = "bold #ff9900"
symbol = "  "

# ── Terraform ─────────────────────────────────────────────────
[terraform]
format = '[$symbol$workspace]($style) '
style = "bold #844fba"
symbol = "󱁢 "

# ── Docker ────────────────────────────────────────────────────
[docker_context]
format = '[$symbol$context]($style) '
style = "bold #2496ED"
symbol = " "
only_with_files = true

# ── Command Duration ──────────────────────────────────────────
[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "bold yellow"

# ── Prompt Character ──────────────────────────────────────────
[character]
success_symbol = "[➜](bold green) "
error_symbol = "[✖](bold red)"

